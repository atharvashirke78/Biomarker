# Reference genes for normalisation: LOCKED 2026-10-14 (lock-diagnostic-v1). Previously PROPOSED. Numbers below are from the NEW fit (alpha 0.05, pre-filter n = 9). Chosen from the Eisenberg & Levanon 2013 housekeeping list on the 19 diagnostic samples only.
status: LOCKED
source: "Eisenberg E, Levanon EY. Human housekeeping genes revisited. Trends Genet 29 (2013), doi 10.1016/j.tig.2013.05.010; list file https://www.tau.ac.il/~elieis/HKG/HK_genes.txt, downloaded 2026-10-13, md5 3c29a7d8976857b6242b317bf58ba25b"
date: 2026-10-13
samples: 19 diagnostic samples (featureCounts route); the 15 validation samples were not used
filters: tested on both routes; not rule 1 on either route; baseMean >= 100 on both routes (FROZEN); equivalence = 90% CI of tumour-vs-normal log2FC inside +/-0.5 (FROZEN), also reported at +/-0.3 (FROZEN)
ranking: equivalent at 0.5 first, then lowest CV of VST (blind, all 19 samples)
